# \u914D\u7F6E\u6570\u636E\u5E93\u7684\u8FDE\u63A5\u4FE1\u606F - \u56DB\u8981\u7D20
#\u9A71\u52A8\u7C7B\u540D\u79F0
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#\u6570\u636E\u5E93\u8FDE\u63A5\u7684url
spring.datasource.url=jdbc:mysql://${DB_URL}/lean_java?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
#\u8FDE\u63A5\u6570\u636E\u5E93\u7684\u7528\u6237\u540D
spring.datasource.username=${DB_USERNAME}
#\u8FDE\u63A5\u6570\u636E\u5E93\u7684\u5BC6\u7801
spring.datasource.password=${DB_PASSWORD}
# Druid \u8FDE\u63A5\u6C60\u6700\u5927\u8FDE\u63A5\u6570\uFF08Druid \u914D\u7F6E\u9879\u4E3A max-active\uFF09
spring.datasource.druid.max-active=2